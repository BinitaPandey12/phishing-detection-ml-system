
name: SecureShield CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-ci:
    name: Python ML API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Flask API imports
        run: python -c "from src.api.app import app; print(app.url_map)"

  java-ci:
    name: Spring Boot Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: phishing-backend/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x phishing-backend/mvnw

      - name: Build Spring Boot application
        run: ./phishing-backend/mvnw -f phishing-backend/pom.xml -B -DskipTests package
